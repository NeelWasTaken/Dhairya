<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="parchmentBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7EDD5"/>
      <stop offset="50%" stop-color="#F1E3C4"/>
      <stop offset="100%" stop-color="#D9BF8C"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A23A"/>
      <stop offset="50%" stop-color="#FFE4B5"/>
      <stop offset="100%" stop-color="#C9A23A"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2B1B10" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#parchmentBg)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Ornate Double Borders -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#B3341F" stroke-width="1.5" stroke-dasharray="10 5"/>

  <!-- Corner Lotus Ornaments -->
  <!-- Top-Left -->
  <circle cx="42" cy="42" r="8" fill="#C9A23A"/>
  <!-- Top-Right -->
  <circle cx="1158" cy="42" r="8" fill="#C9A23A"/>
  <!-- Bottom-Left -->
  <circle cx="42" cy="588" r="8" fill="#C9A23A"/>
  <!-- Bottom-Right -->
  <circle cx="1158" cy="588" r="8" fill="#C9A23A"/>

  <!-- Palm-leaf string circles -->
  <circle cx="80" cy="315" r="16" fill="#F1E3C4" stroke="#C9A23A" stroke-width="3"/>
  <circle cx="1120" cy="315" r="16" fill="#F1E3C4" stroke="#C9A23A" stroke-width="3"/>

  <!-- Header Sanskrit Motto -->
  <text x="600" y="140" text-anchor="middle" font-family="serif" font-size="34" fill="#B3341F" letter-spacing="4">
    ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै ।
  </text>

  <!-- Central OM Glyph -->
  <text x="600" y="240" text-anchor="middle" font-family="serif" font-size="75" fill="#C9A23A" font-weight="bold">
    ॐ
  </text>

  <!-- Main Title -->
  <text x="600" y="330" text-anchor="middle" font-family="'Cinzel', serif" font-size="70" font-weight="900" fill="#2B1B10" letter-spacing="12">
    DHAIRYA
  </text>
  <text x="600" y="380" text-anchor="middle" font-family="'Cinzel', serif" font-size="28" font-weight="600" fill="#E8892B" letter-spacing="6">
    THE UNSHAKEN SELF
  </text>

  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-style="italic" fill="#5C3D2E">
    "The storm moves the tree. It does not move the ground."
  </text>
  <text x="600" y="480" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" fill="#8A6E20" letter-spacing="2">
    Psychological Resilience in the Upaniṣads • Indian Knowledge Systems
  </text>

  <!-- Bottom Details -->
  <text x="600" y="550" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" fill="#2B1B10" letter-spacing="3">
    18 CHAPTERS • 43 VERIFIED VERSES • 75 TERMS • INTERACTIVE ALLEGORIES
  </text>
</svg>
